name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::VERSION must be MAJOR.MINOR.PATCH, got '$version'"
            exit 1
          }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release notes in CHANGELOG.md
        run: python tools/release_notes.py "${{ steps.version.outputs.version }}"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Build device
        run: python tools/build.py --version "${{ steps.version.outputs.tag }}"

      - name: Fail if the committed patch is out of date
        run: |
          git diff --exit-code -- src/ || {
            echo "::error::src/ChordMonitor++.maxpat differs from the generated version. Run 'python tools/build.py' and commit."
            exit 1
          }

      - name: Test
        run: python -m pytest -q

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ChordMonitor++-${{ steps.version.outputs.tag }}-build-${{ github.run_number }}
          path: dist/ChordMonitor++.amxd
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    concurrency: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for an existing release
        id: existing
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released, nothing to publish"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.existing.outputs.released == 'false'
        with:
          python-version: "3.12"

      - name: Build device and release notes
        if: steps.existing.outputs.released == 'false'
        run: |
          python tools/build.py --version "$TAG"
          python tools/release_notes.py "$VERSION" > release-notes.md

      - name: Publish release
        if: steps.existing.outputs.released == 'false'
        run: |
          gh release create "$TAG" \
            "dist/ChordMonitor++.amxd" \
            --target "$GITHUB_SHA" \
            --title "ChordMonitor++ $TAG" \
            --notes-file release-notes.md
